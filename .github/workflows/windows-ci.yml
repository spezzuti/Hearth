name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type, test, build, audit, and Electron smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out Hearth
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build renderer and desktop processes
        run: npm run build

      - name: Run deterministic Electron scenarios
        run: npx playwright test
        env:
          CI: "true"

      - name: Preserve failed Electron traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-windows
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
